apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: driver-duo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driver-duo
  template:
    metadata:
      labels:
        app: driver-duo
    spec:
      containers:
        - name: app
          image: alveoniro98/driver-duo:1.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: driver-duo-secret
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: driver-duo
spec:
  type: NodePort
  selector:
    app: driver-duo
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
